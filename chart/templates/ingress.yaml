{{- if .Values.ingress.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "spotify-tracker.fullname" . }}-redirect-https
  labels:
    {{- include "spotify-tracker.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "spotify-tracker.fullname" . }}-tls
  labels:
    {{- include "spotify-tracker.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.ingress.tlsSecret }}
  dnsNames:
    - {{ .Values.ingress.host }}
  issuerRef:
    name: {{ .Values.ingress.clusterIssuer }}
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "spotify-tracker.fullname" . }}-web
  labels:
    {{- include "spotify-tracker.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoints.web }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`)
      middlewares:
        - name: {{ include "spotify-tracker.fullname" . }}-redirect-https
      services:
        - name: {{ include "spotify-tracker.fullname" . }}
          port: {{ .Values.service.port }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "spotify-tracker.fullname" . }}-websecure
  labels:
    {{- include "spotify-tracker.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoints.websecure }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`)
      services:
        - name: {{ include "spotify-tracker.fullname" . }}
          port: {{ .Values.service.port }}
  tls:
    secretName: {{ .Values.ingress.tlsSecret }}
{{- end }}
