{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spotify-tracker.fullname" . }}-secrets
  labels:
    {{- include "spotify-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPOTIPY_CLIENT_ID: {{ .Values.secrets.spotifyClientId | quote }}
  SPOTIPY_CLIENT_SECRET: {{ .Values.secrets.spotifyClientSecret | quote }}
  FLASK_SECRET_KEY: {{ .Values.secrets.flaskSecretKey | quote }}
  {{- if .Values.postgresql.enabled }}
  {{- $pass := include "spotify-tracker.postgresPassword" . }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgresql.auth.username $pass (include "spotify-tracker.fullname" .) .Values.postgresql.auth.database | quote }}
  {{- /* ponytail: DATABASE_URL reuses the postgres password helper; set postgresql.auth.password for stable GitOps */ -}}
  {{- else }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
{{- end }}
