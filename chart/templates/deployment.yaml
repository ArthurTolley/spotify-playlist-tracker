apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spotify-tracker.fullname" . }}
  labels:
    {{- include "spotify-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: spotify-tracker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spotify-tracker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8888
              name: http
          env:
            - name: SPOTIPY_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ include "spotify-tracker.fullname" . }}-config
                  key: SPOTIPY_REDIRECT_URI
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "spotify-tracker.fullname" . }}-config
                  key: CORS_ORIGINS
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "spotify-tracker.fullname" . }}-config
                  key: FLASK_ENV
            - name: SPOTIPY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotify-tracker.backendSecretName" . }}
                  key: SPOTIPY_CLIENT_ID
            - name: SPOTIPY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotify-tracker.backendSecretName" . }}
                  key: SPOTIPY_CLIENT_SECRET
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotify-tracker.backendSecretName" . }}
                  key: FLASK_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotify-tracker.backendSecretName" . }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
