# Spotify Playlist Tracker - Nginx configuration
#
# Backend routes (defined in backend/app.py) are proxied to the gunicorn
# backend service. Current proxied routes:
#   /login, /callback, /logout, /profile, /track, /sync/<id>,
#   /toggle_auto_sync/<id>, /untrack/<id>, /undo_untrack, /delete/<id>,
#   /edit_playlist/<id>, /dislike_song/<id>/<uri>
# If you add a new backend route, add it to the regex below (and keep this
# comment up to date).

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy backend API routes to the gunicorn backend service
    location ~ ^/(login|callback|logout|profile|track|sync|toggle_auto_sync|untrack|undo_untrack|delete|edit_playlist|dislike_song)(/|$) {
        proxy_pass http://backend:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA catch-all
    location / {
        try_files $uri $uri/ /index.html;
    }
}
