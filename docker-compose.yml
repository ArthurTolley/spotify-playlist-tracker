services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spotifytracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spotifytracker}
      POSTGRES_DB: ${POSTGRES_DB:-spotify_tracker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./spotify_tracker.dump:/docker-entrypoint-initdb.d/spotify_tracker.dump:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spotifytracker}:${POSTGRES_PASSWORD:-spotifytracker}@db:5432/${POSTGRES_DB:-spotify_tracker}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      SPOTIPY_REDIRECT_URI: ${SPOTIPY_REDIRECT_URI:-http://127.0.0.1:8888/callback}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8888}
    volumes:
      - trackify-data:/data
    expose:
      - "8888"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8888/', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trackify-data:
  postgres-data:
